{% extends 'base.html' %}

{% block title %}Account Settings - JobPortal AI{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-sm border-0 rounded-3">
                <div class="card-body p-4 p-md-5">
                    <h4 class="fw-bold mb-3"><i class="bi bi-gear-fill text-primary me-2"></i> Account Settings</h4>
                    <p class="text-muted small">Update your primary contact information</p>

                    <form method="post">
                        {% csrf_token %}
                        <div class="mb-3">
                            <label class="form-label small fw-semibold">First Name</label>
                            {{ form.first_name }}
                        </div>
                        <div class="mb-3">
                            <label class="form-label small fw-semibold">Last Name</label>
                            {{ form.last_name }}
                        </div>
                        <div class="mb-3">
                            <label class="form-label small fw-semibold">Email Address</label>
                            {{ form.email }}
                        </div>
                        <div class="d-flex justify-content-between align-items-center mt-4">
                            <a href="{% url 'dashboard_redirect' %}" class="btn btn-outline-secondary">Back to Dashboard</a>
                            <button type="submit" class="btn btn-primary">Save Changes</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

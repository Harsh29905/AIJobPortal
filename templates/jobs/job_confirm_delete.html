{% extends 'base.html' %}

{% block title %}Delete Job - JobPortal AI{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-sm border-0 rounded-3">
                <div class="card-body p-4 p-md-5 text-center">
                    <i class="bi bi-exclamation-triangle-fill text-danger fs-1 mb-3 d-block"></i>
                    <h4 class="fw-bold mb-2">Delete Job Opening?</h4>
                    <p class="text-muted small mb-4">
                        Are you sure you want to permanently delete <strong>"{{ job.title }}"</strong>? This action will also remove all associated applications.
                    </p>

                    <form method="post">
                        {% csrf_token %}
                        <div class="d-flex justify-content-center gap-2">
                            <a href="{% url 'recruiter_dashboard' %}" class="btn btn-outline-secondary">Cancel</a>
                            <button type="submit" class="btn btn-danger px-4">Yes, Delete Job</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
